# Import local .env file if it exists
spring.config.import=optional:file:.env[.properties]

spring.application.name=pixel-portfolio
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/trading_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

spring.jackson.serialization.write-dates-as-timestamps=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

app.market.provider=mock
app.market.default-currency=USD

groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:llama-3.1-70b-versatile}
groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1/chat/completions}
