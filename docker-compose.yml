services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${DB_PORT:-33061}:3306"
    volumes:
      - mysqldata:/var/lib/mysql
      - ./infra/db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY}
      TWELVEDATA_API_KEY: ${TWELVEDATA_API_KEY}
      SEED_DIR: /app/seed
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:18173}
    volumes:
      - ./infra/db/seed:/app/seed:ro
    ports:
      - "${BACKEND_PORT:-18080}:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GROQ_API_KEY: ${VITE_GROQ_API_KEY:-}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-18173}:80"

volumes:
  mysqldata:
