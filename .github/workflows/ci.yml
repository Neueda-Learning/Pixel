name: CI
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - name: Build & test backend
        working-directory: backend
        run: mvn -B clean package

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check frontend project exists
        id: check
        run: echo "exists=$( [ -f frontend/package.json ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with: { node-version: '20', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Build frontend
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: |
          npm install
          npm run build

  docker:
    needs: [ backend, frontend ]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image (sanity)
        run: docker build -t portfolio-backend ./backend
      - name: Build frontend image (sanity)
        if: hashFiles('frontend/package.json') != ''
        run: docker build -t portfolio-frontend ./frontend
