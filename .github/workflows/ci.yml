name: CI
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - name: Run backend tests
        working-directory: backend
        run: mvn -B test
      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7
      - name: Build backend package
        working-directory: backend
        run: mvn -B package -DskipTests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check frontend project exists
        id: check
        run: echo "exists=$( [ -f frontend/package.json ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with: { node-version: '20', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Install frontend dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm install
      - name: Run frontend tests with coverage
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run test:coverage --if-present
      - name: Upload frontend coverage report
        if: always() && steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
          retention-days: 7
      - name: Build frontend
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build

  docker:
    needs: [ backend, frontend ]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image (sanity)
        run: docker build -t portfolio-backend ./backend
      - name: Build frontend image (sanity)
        if: hashFiles('frontend/package.json') != ''
        run: docker build -t portfolio-frontend ./frontend
